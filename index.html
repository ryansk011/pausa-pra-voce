<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uma pausa pra você 💙</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#dbeafe 0,#eef2ff 38%,#fdf2f8 100%);display:flex;align-items:center;justify-content:center;color:#172033;padding:20px;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.28);filter:blur(8px);z-index:-1}
body:before{top:-90px;left:-70px}body:after{bottom:-100px;right:-70px}
.card{width:min(650px,100%);background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.8);border-radius:30px;padding:34px 28px 26px;box-shadow:0 24px 70px rgba(31,41,55,.16);text-align:center;position:relative;overflow:hidden;backdrop-filter:blur(8px)}
.progress{height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-bottom:26px}.progress span{display:block;height:100%;background:#172033;border-radius:99px;transition:width .35s ease}
.emoji{font-size:48px;margin:2px 0 10px}.step{font-size:12px;color:#64748b;margin-bottom:14px;letter-spacing:.08em;text-transform:uppercase}.title{font-size:31px;font-weight:800;line-height:1.12;margin:0 0 16px}.text{font-size:17px;line-height:1.7;color:#475569;margin:0 auto 24px;max-width:530px}
.box{background:#f8fafc;border-radius:20px;padding:18px;text-align:left;margin:18px auto 25px;max-width:500px;border:1px solid #e2e8f0}.box div{padding:7px 0}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:999px;padding:14px 22px;font-size:16px;font-weight:700;cursor:pointer;background:#172033;color:white;transition:.18s}button:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.tiny{margin-top:24px;font-size:12px;color:#94a3b8}.fade{animation:fade .4s ease}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.final{font-size:18px}.signature{margin-top:22px;font-size:14px;color:#64748b}
@media(max-width:480px){.card{padding:28px 20px 22px}.title{font-size:27px}.text{font-size:16px}}
</style>
</head>
<body>
<main class="card">
<div class="progress"><span id="bar"></span></div>
<div id="screen" class="fade"></div>
<div class="tiny">feito com carinho, sem nenhuma obrigação de responder 💙</div>
</main>
<script>
const screens=[
{emoji:"👀",title:"Amor, tenho uma coisa pra te contar...",text:"Depois de uma investigação extremamente séria, cheguei a uma conclusão meio óbvia.",button:"Quero saber 👀"},
{emoji:"🫵🏻",title:"O problema é você, princesa.",text:"Porque eu gosto muito de ficar perto de você. Gosto das nossas conversas, das besteiras, das risadas e daqueles momentos em que a gente simplesmente fica de boa juntos.\n\nE sim... às vezes bate aquela saudadezinha. Mas prometo não fazer um drama sobre isso kkkkk.",button:"Tá, e sábado?"},
{emoji:"🗓️",title:"Sábado. 💙",text:"Bebê, eu tô bem ansioso pra te ver. Quero chegar aí, ficar pertinho, conversar, rir, te abraçar, te beijar e ficar de bobeira com você.\n\nE não tô indo com uma expectativa de como o dia precisa ser. Se a gente fizer mil coisas, ótimo. Se ficar só conversando, ótimo também.\n\nSe rolar alguma coisa a mais, maravilhoso. Se não rolar, também. Eu só quero aproveitar um tempinho com você, amor.",button:"Mas eu sei de uma coisa..."},
{emoji:"🤍",title:"Eu sei que você tá na correria.",text:"Faculdade, estágio, um milhão de coisas e provavelmente uma cabeça cheia. Então fica tranquila, neném.\n\nSe a gente não conseguir conversar tanto agora, tá tudo bem. Quando você tiver um tempinho, a gente conversa e coloca o papo em dia.\n\nEu não quero ser mais uma cobrança no meio da sua rotina. Só quero que você saiba que, quando precisar, pode contar comigo.",button:"Última coisa..."},
{emoji:"🥹",title:"Eu só quero que você saiba disso.",text:"Eu gosto de você, princesa. Gosto de estar com você e gosto do jeito que a gente é quando tá junto.\n\nEntão sábado eu só quero te ver, te dar um abraço apertado, ficar pertinho e aproveitar você. Sem pressão, sem roteiro e sem precisar transformar tudo em alguma coisa.\n\nE quando você precisar de mim, seja pra conversar, reclamar, rir, jogar, assistir alguma coisa ou simplesmente ficar quietinha... eu tô aqui. 💙",final:true}
];
let i=0;
function render(){
const s=screens[i],el=document.getElementById("screen");
document.getElementById("bar").style.width=((i+1)/screens.length*100)+"%";
el.className="fade";
el.innerHTML='<div class="emoji">'+s.emoji+'</div><div class="step">'+(i+1)+' de '+screens.length+'</div><h1 class="title">'+s.title+'</h1><p class="text '+(s.final?'final':'')+'">'+s.text.replace(/\n/g,"<br>")+'</p>'+(s.final?'':'<div class="btns"><button onclick="next()">'+s.button+'</button></div>')+(s.final?'<div class="signature"><br><i>PS: sim, eu fiz um site inteiro pra você. Não se acostuma kkkkk 💙</i></div>':'');
}
function next(){if(i<screens.length-1){i++;render()}}
render();
</script>
</body>
</html>
