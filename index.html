<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pra você, amor 💗</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff0f6,#ffe4ef 45%,#fff7fb);display:flex;align-items:center;justify-content:center;color:#3b2631;padding:20px;overflow:hidden;position:relative}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.heart{position:absolute;color:#f4a6c4;opacity:.28;font-size:22px;animation:float linear infinite}
.heart:nth-child(1){left:7%;top:12%;font-size:28px;animation-duration:8s}.heart:nth-child(2){left:18%;top:78%;font-size:18px;animation-duration:11s}.heart:nth-child(3){left:31%;top:22%;font-size:16px;animation-duration:9s}.heart:nth-child(4){left:48%;top:88%;font-size:30px;animation-duration:12s}.heart:nth-child(5){left:67%;top:15%;font-size:20px;animation-duration:10s}.heart:nth-child(6){left:81%;top:72%;font-size:27px;animation-duration:9s}.heart:nth-child(7){left:92%;top:30%;font-size:15px;animation-duration:13s}.heart:nth-child(8){left:55%;top:8%;font-size:14px;animation-duration:10s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-18px) rotate(8deg)}}
.card{z-index:1;width:min(650px,100%);background:rgba(255,255,255,.92);border:1px solid #ffd2e2;border-radius:30px;padding:34px 28px 26px;box-shadow:0 24px 70px rgba(183,76,119,.15);text-align:center;backdrop-filter:blur(8px)}
.progress{height:6px;background:#f9d9e6;border-radius:99px;overflow:hidden;margin-bottom:26px}.progress span{display:block;height:100%;background:#e78caf;border-radius:99px;transition:width .35s ease}
.emoji{font-size:46px;margin:2px 0 10px}.step{font-size:12px;color:#b06b87;margin-bottom:14px;letter-spacing:.08em;text-transform:uppercase}.title{font-size:30px;font-weight:800;line-height:1.15;margin:0 0 16px;color:#542d3d}.text{font-size:17px;line-height:1.7;color:#6d4b59;margin:0 auto 24px;max-width:530px}
.btns{display:flex;justify-content:center}button{border:0;border-radius:999px;padding:14px 24px;font-size:16px;font-weight:700;cursor:pointer;background:#e78caf;color:white;transition:.18s;box-shadow:0 6px 18px rgba(231,140,175,.25)}button:hover{transform:translateY(-2px)}
.tiny{margin-top:24px;font-size:12px;color:#c18ba0}.fade{animation:fade .4s ease}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.final{font-size:18px}.signature{margin-top:22px;font-size:14px;color:#a46b82}
@media(max-width:480px){.card{padding:28px 20px 22px}.title{font-size:27px}.text{font-size:16px}}
</style>
</head>
<body>
<div class="hearts"><span class="heart">♥</span><span class="heart">♡</span><span class="heart">♥</span><span class="heart">♡</span><span class="heart">♥</span><span class="heart">♡</span><span class="heart">♥</span><span class="heart">♡</span></div>
<main class="card">
<div class="progress"><span id="bar"></span></div>
<div id="screen" class="fade"></div>
<div class="tiny">feito com carinho, só pra te lembrar de uma coisa 💗</div>
</main>
<script>
const screens=[
{emoji:"💗",title:"Amor, isso aqui é só pra você.",text:"Eu sei que ultimamente tá tudo meio corrido. Faculdade, estágio, responsabilidades, coisas pra resolver... e às vezes parece que não sobra tempo nem pra respirar.",button:"Continua..."},
{emoji:"🌷",title:"Então eu queria te lembrar de uma coisa.",text:"Você não precisa dar conta de tudo ao mesmo tempo, princesa. E muito menos precisa se preocupar em estar disponível o tempo todo pra mim.\n\nSe estiver cansada, descansa. Se estiver ocupada, cuida das suas coisas. Se precisar de um tempo, aproveita seu tempo. Tá tudo bem.",button:"Mas e eu?"},
{emoji:"🤍",title:"Eu tô aqui, neném.",text:"Sem cobrança. Sem pressão. Sem você precisar me dar nada em troca.\n\nSe quiser conversar, eu te escuto. Se quiser reclamar, pode reclamar comigo. Se quiser rir e falar besteira, eu tô dentro. Se quiser jogar ou assistir alguma coisa, também.\n\nE se você só quiser ficar quietinha, eu fico do seu lado também.",button:"E sábado?"},
{emoji:"🩷",title:"Sobre sábado...",text:"Eu tô ansioso pra te ver, bebê. Mas não porque espero que o sábado tenha que ser de um jeito específico.\n\nQuero só estar com você. Te abraçar, te beijar, ficar pertinho, conversar, rir, fazer nada... o que der vontade.\n\nSe a gente fizer mil coisas, ótimo. Se passar a tarde deitada conversando, ótimo também. O importante pra mim é poder passar um tempinho com você.",button:"Última coisinha..."},
{emoji:"🥹",title:"E se em algum momento ficar pesado...",text:"Lembra que você não precisa carregar tudo sozinha, amor.\n\nEu não quero ser mais uma preocupação na sua cabeça. Quero ser justamente aquela pessoa que você sabe que pode chamar quando precisar.\n\nEntão vai no seu ritmo. Cuida de você. Faz o que você precisa fazer. E quando sobrar um tempinho, a gente conversa, ri e mata a saudade das nossas besteiras.\n\nEu vou estar aqui. 💗",final:true}
];
let i=0;
function render(){
const s=screens[i],el=document.getElementById("screen");
document.getElementById("bar").style.width=((i+1)/screens.length*100)+"%";
el.className="fade";
el.innerHTML='<div class="emoji">'+s.emoji+'</div><div class="step">'+(i+1)+' de '+screens.length+'</div><h1 class="title">'+s.title+'</h1><p class="text '+(s.final?'final':'')+'">'+s.text.replace(/\n/g,"<br>")+'</p>'+(s.final?'<div class="signature">Até sábado, princesa. 💗<br><br><i>PS: isso aqui não é uma cobrança. É só um lembrete de que eu tô do seu lado.</i></div>':'<div class="btns"><button onclick="next()">'+s.button+'</button></div>');
}
function next(){if(i<screens.length-1){i++;render()}}
render();
</script>
</body>
</html>
