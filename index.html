<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uma pausa pra você 💙</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#dbeafe 0,#eef2ff 38%,#fdf2f8 100%);display:flex;align-items:center;justify-content:center;color:#172033;padding:20px;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.28);filter:blur(8px);z-index:-1}
body:before{top:-90px;left:-70px}body:after{bottom:-100px;right:-70px}
.card{width:min(650px,100%);background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.8);border-radius:30px;padding:34px 28px 26px;box-shadow:0 24px 70px rgba(31,41,55,.16);text-align:center;position:relative;overflow:hidden;backdrop-filter:blur(8px)}
.progress{height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-bottom:26px}.progress span{display:block;height:100%;background:#172033;border-radius:99px;transition:width .35s ease}
.emoji{font-size:48px;margin:2px 0 10px}.step{font-size:12px;color:#64748b;margin-bottom:14px;letter-spacing:.08em;text-transform:uppercase}.title{font-size:31px;font-weight:800;line-height:1.12;margin:0 0 16px}.text{font-size:17px;line-height:1.7;color:#475569;margin:0 auto 24px;max-width:530px}
.box{background:#f8fafc;border-radius:20px;padding:18px;text-align:left;margin:18px auto 25px;max-width:500px;border:1px solid #e2e8f0}.box div{padding:7px 0}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:999px;padding:14px 22px;font-size:16px;font-weight:700;cursor:pointer;background:#172033;color:white;transition:.18s}button:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.12)}button.alt{background:#e2e8f0;color:#334155}
.tiny{margin-top:24px;font-size:12px;color:#94a3b8}.fade{animation:fade .4s ease}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.final{font-size:18px}.signature{margin-top:22px;font-size:14px;color:#64748b}
@media(max-width:480px){.card{padding:28px 20px 22px}.title{font-size:27px}.text{font-size:16px}}
</style>
</head>
<body>
<main class="card">
<div class="progress"><span id="bar"></span></div>
<div id="screen" class="fade"></div>
<div class="tiny">feito com carinho, sem nenhuma obrigação de responder 💙</div>
</main>
<script>
const screens=[
{emoji:"💙",title:"Tenho uma coisa pra te contar...",text:"E aparentemente não existe tratamento para isso.",button:"Investigar o caso 👀"},
{emoji:"🥹",title:"Diagnóstico confirmado.",text:"Depois de uma investigação minuciosa, foram encontrados os seguintes sintomas:",box:["vontade de conversar com você por horas","saudade das nossas besteiras","saudade de ficar perto de você","vontade de te ver","uma ansiedade meio idiota para sábado"],button:"E agora? 👀"},
{emoji:"🗓️",title:"SÁBADO.",text:"Eu tô ansioso pra te ver. Quero chegar aí, ficar pertinho de você, conversar, rir, te abraçar, te beijar, ficar de bobeira...\n\nSó quero aproveitar você.\n\nE, sinceramente? Não importa se sábado vai ser exatamente como a gente imaginou ou se vai ser completamente diferente.\n\nEu só quero te ver. 💙",button:"Tem mais uma coisa..."},
{emoji:"🌙",title:"Eu sei que você tá corrida.",text:"Eu sei que ultimamente você tá cheia de coisa. Faculdade, estágio, responsabilidades, cabeça cheia... E eu sei que às vezes você simplesmente não tem tempo nem pra respirar direito.\n\nEntão não precisa se preocupar comigo por causa disso.\n\nTá tudo bem se a gente não conseguir conversar tanto agora. Quando você tiver um tempinho, a gente conversa.\n\nEu vou continuar aqui.\n\nPorque eu sinto falta de conversar com você pra caramba, mas não quero que minha saudade vire mais uma coisa pra você ter que dar conta.",button:"E quando você precisar... 🤍"},
{emoji:"🤍",title:"Quando você precisar, eu tô aqui.",text:"Pra conversar.\n\nPra ouvir você reclamar.\n\nPra te distrair.\n\nPra jogar alguma coisa.\n\nPra assistir alguma coisa.\n\nPra falar besteira.\n\nPra ficar em silêncio.\n\nOu simplesmente pra te lembrar que você não precisa resolver tudo sozinha.",button:"Última coisa, prometo..."},
{emoji:"🥹",title:"Eu só tô com saudade.",text:"Saudade de conversar com você.\n\nSaudade de rir com você.\n\nSaudade de ficar perto de você.\n\nE tô ansioso pra sábado.\n\nNão pelo que vai acontecer.\n\nSó porque vou poder te ver.\n\nTe abraçar.\n\nTe beijar.\n\nFicar juntinho.\n\nSentir seu carinho.\n\nE passar um tempinho com você.\n\nÉ só isso que eu quero. 💙",final:true}
];
let i=0;
function render(){
const s=screens[i],el=document.getElementById("screen");
document.getElementById("bar").style.width=((i+1)/screens.length*100)+"%";
el.className="fade";
el.innerHTML='<div class="emoji">'+s.emoji+'</div><div class="step">'+(i+1)+' de '+screens.length+'</div><h1 class="title">'+s.title+'</h1><p class="text '+(s.final?'final':'')+'">'+s.text.replace(/\n/g,"<br>")+'</p>'+(s.box?'<div class="box">'+s.box.map(x=>'<div>• '+x+'</div>').join("")+'</div>':'')+'<div class="btns">'+(s.final?'':'<button onclick="next()">'+s.button+'</button>')+'</div>'+(s.final?'<div class="signature">Até sábado, Nic. 💙<br><br><i>PS: sim, eu fiz um site inteiro só porque tava com saudade. Não julga.</i></div>':'');
}
function next(){if(i<screens.length-1){i++;render()}}
render();
</script>
</body>
</html>
